<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini WhatsApp</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <div class="app-logo">
                <i class="fab fa-whatsapp"></i>
                <h1>Mini WhatsApp</h1>
            </div>
            
            <div id="login-form" class="form-container">
                <h2>Welcome Back!</h2>
                <input type="email" id="login-email" placeholder="Email" class="form-input">
                <input type="password" id="login-password" placeholder="Password" class="form-input">
                <button id="login-btn" class="btn-primary">Sign In</button>
                <p class="auth-switch">Don't have an account? <span id="show-signup">Sign Up</span></p>
            </div>

            <div id="signup-form" class="form-container hidden">
                <h2>Create Account</h2>
                <input type="text" id="signup-name" placeholder="Full Name" class="form-input">
                <input type="email" id="signup-email" placeholder="Email" class="form-input">
                <input type="password" id="signup-password" placeholder="Password" class="form-input">
                <button id="signup-btn" class="btn-primary">Create Account</button>
                <p class="auth-switch">Already have an account? <span id="show-login">Sign In</span></p>
            </div>
        </div>
    </div>

    <!-- Contacts Screen -->
    <div id="contacts-container" class="contacts-container hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <h3 id="username">User</h3>
                    <p id="user-status">Online</p>
                </div>
            </div>
            <div class="header-right">
                <i class="fas fa-search" id="search-users"></i>
                <i class="fas fa-ellipsis-v"></i>
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Contacts List -->
        <div class="contacts-list" id="contacts-list">
            <div class="loading" id="loading-contacts">Loading contacts...</div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div id="chat-container" class="chat-container hidden">
        <!-- Chat Header -->
        <header class="chat-header">
            <button id="back-to-contacts" class="back-button">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-user-info">
                <div class="avatar" id="chat-user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <h3 id="chat-username">Select a user</h3>
                    <p id="chat-user-status">Online</p>
                </div>
            </div>
            <div class="chat-header-right">
                <i class="fas fa-video"></i>
                <i class="fas fa-phone"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </header>

        <!-- Messages Container -->
        <div class="messages-container" id="messages-container">
            <div class="welcome-message">
                <p>Select a contact to start chatting</p>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <button class="emoji-button">
                <i class="far fa-smile"></i>
            </button>
            <button class="attach-button">
                <i class="fas fa-paperclip"></i>
            </button>
            <input type="text" id="message-input" class="message-input" placeholder="Type a message..." disabled>
            <button id="send-btn" class="send-button" disabled>
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDafyxtNyY9VNzl-lrsMY6uqpKBh-N5fTQ",
            authDomain: "project-who-57771.firebaseapp.com",
            projectId: "project-who-57771",
            storageBucket: "project-who-57771.firebasestorage.app",
            messagingSenderId: "70583164472",
            appId: "1:70583164472:web:9946991130c8ba304190cd",
            measurementId: "G-01R3BCGZ5F"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            console.log('Firebase initialized successfully');
        } catch (error) {
            console.error('Firebase initialization error:', error);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
    </script>

    <!-- App Scripts -->
    <script src="./js/auth.js"></script>
    <script src="./js/contacts.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
