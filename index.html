<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letstalk</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Auth Screen -->
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <div class="app-logo">
                <i class="fab fa-whatsapp"></i>
                <h1>Mini WhatsApp</h1>
            </div>
            
            <div id="login-form" class="form-container">
                <h2>Welcome Back!</h2>
                <input type="email" id="login-email" placeholder="Email" class="form-input">
                <input type="password" id="login-password" placeholder="Password" class="form-input">
                <button id="login-btn" class="btn-primary">Sign In</button>
                <p class="auth-switch">Don't have an account? <span id="show-signup">Sign Up</span></p>
            </div>

            <div id="signup-form" class="form-container hidden">
                <h2>Create Account</h2>
                <input type="text" id="signup-name" placeholder="Full Name" class="form-input">
                <input type="email" id="signup-email" placeholder="Email" class="form-input">
                <input type="password" id="signup-password" placeholder="Password" class="form-input">
                <button id="signup-btn" class="btn-primary">Create Account</button>
                <p class="auth-switch">Already have an account? <span id="show-login">Sign In</span></p>
            </div>
        </div>
    </div>

    <!-- Main Chat App -->
    <div id="app-container" class="app-container hidden">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="avatar" id="user-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="user-info">
                    <h3 id="username">User</h3>
                    <p id="user-status">Online</p>
                </div>
            </div>
            <div class="header-right">
                <i class="fas fa-search"></i>
                <i class="fas fa-ellipsis-v"></i>
                <button id="logout-btn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Chat Container -->
        <div class="chat-container" id="chat-container">
            <!-- Messages will be loaded here -->
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <button class="emoji-button">
                <i class="far fa-smile"></i>
            </button>
            <button class="attach-button">
                <i class="fas fa-paperclip"></i>
            </button>
            <input type="text" id="message-input" class="message-input" placeholder="Type a message...">
            <button id="send-btn" class="send-button">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDafyxtNyY9VNzl-lrsMY6uqpKBh-N5fTQ",
            authDomain: "project-who-57771.firebaseapp.com",
            projectId: "project-who-57771",
            storageBucket: "project-who-57771.firebasestorage.app",
            messagingSenderId: "70583164472",
            appId: "1:70583164472:web:9946991130c8ba304190cd",
            measurementId: "G-01R3BCGZ5F"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make them globally available
        window.auth = auth;
        window.db = db;
        window.firebaseApp = app;

        // Load other scripts after Firebase is initialized
        setTimeout(() => {
            const authScript = document.createElement('script');
            authScript.src = 'js/auth.js';
            document.body.appendChild(authScript);

            const chatScript = document.createElement('script');
            chatScript.src = 'js/chat.js';
            document.body.appendChild(chatScript);

            const appScript = document.createElement('script');
            appScript.src = 'js/app.js';
            document.body.appendChild(appScript);
        }, 100);
    </script>
</body>
</html>
